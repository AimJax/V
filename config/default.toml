[app]
name = "V"
environment = "development"

[llm]
provider = "lm_studio"
base_url = "http://127.0.0.1:1234/v1"
model = "gemma-4-e4b-it"
request_timeout_seconds = 120
temperature = 0.7
max_tokens = 512
history_messages = 24

[privacy]
offline_mode = false
telemetry_enabled = false
cloud_ai_fallback = false

[web_search]
enabled = false
provider = ""
allowed_hosts = []

[web_retrieval]
enabled = false

[memory]
enabled = true
automatic_extraction = true
retrieval_enabled = true
embedding_provider = "lm_studio"
embedding_model = "text-embedding-nomic-embed-text-v1.5"
semantic_threshold = 0.60
retrieval_limit = 5
retrieval_max_characters = 2400
idle_delay_seconds = 20
max_jobs_per_idle_cycle = 3
minimum_confidence = 0.90

[voice]
# Voice mode remains inactive until local engines are installed and validated.
enabled = false
wake_phrase = "Hey V"
input_device_id = ""
output_device_id = ""
sample_rate = 16000
stt_language = "auto"
stt_threads = 4
whisper_server_path = "apps/whisper.cpp/build/bin/Release/whisper-server.exe"
whisper_model_path = "models/whisper/ggml-base.bin"
silero_vad_model_path = "models/whisper/ggml-silero-v6.2.0.bin"
vad_threshold = 0.50
vad_min_speech_duration_ms = 250
vad_silence_duration_ms = 700
max_utterance_seconds = 30
kokoro_python_path = "voice-venv312/Scripts/python.exe"
kokoro_voice = "af_heart"
tts_speed = 1.0

[paths]
models = "G:/V/models"
data = "G:/V/data"
logs = "G:/V/logs"
recordings = "G:/V/recordings"
cache = "G:/V/cache"
personality = "config/personality.md"
conversation_db = "data/conversations/conversations.sqlite3"
memory_db = "data/memory/memory.sqlite3"