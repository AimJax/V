[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "v-companion"
version = "0.1.0"
description = "A local-first AI companion for Windows."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.27,<1.0",
    "aiohttp>=3.12,<4.0"
]

[project.optional-dependencies]
desktop = [
    "PySide6>=6.11,<6.12",
    "tomlkit>=0.13,<1.0"
]
voice = [
    "kokoro-onnx>=0.6.1,<0.7"
]
voice-gpu = [
    "kokoro-onnx[gpu]>=0.6.1,<0.7"
]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1"
]

[project.scripts]
v-diagnostic = "v.diagnostics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"